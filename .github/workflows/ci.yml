name: CI

# The planner in planner/ has its own tests and workflow (planner.yml).
on:
  push:
    branches: [master]
    paths-ignore: ['planner/**']
  pull_request:
    branches: [master]
    paths-ignore: ['planner/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
